return `<div class="card"><b>${c}</b> <span class="mu">${d} км</span><div class="sc" style="margin-top:10px">${Object.keys(TR).map(m=>{const t=TR[m],days=m=='plane'?1:Math.max(1,Math.ceil(d/t.sp));return `<button class="chip" onclick="A.go(${i},'${m}')">${t.e} ${rub(r100(t.b+d*t.r))} · ${days} дн.</button>`}).join('')}</div></div>`}).join('')},
wal(){const tier=S.pts<50?'Новичок':S.pts<200?'Перекуп':S.pts<600?'Профи':'Легенда';
return `<div class="card bal"><div class="mu">Баланс</div><div class="big">${rub(S.money)}</div><div class="mu">Капитал ${rub(nw())}</div></div>
<div class="mg"><div class="card"><div class="mu">Сделок</div><b style="font-size:22px">${S.deals}</b></div><div class="card"><div class="mu">Прибыль</div><b style="font-size:22px;color:${S.profit>=0?'var(--g)':'var(--r)'}">${rub(S.profit)}</b></div><div class="card"><div class="mu">Баллы TYNTYTY</div><b style="font-size:22px">${S.pts}</b></div><div class="card"><div class="mu">Ранг</div><b style="font-size:22px">${tier}</b></div></div>
<b>История</b>${S.hist.map(h=>`<div class="row" style="justify-content:space-between"><span style="font-size:14px">${h.t}<span class="mu"> · день ${h.d}</span></span><b style="color:${h.a>0?'var(--g)':'var(--tx)'}">${h.a>0?'+':''}${rub(h.a)}</b></div>`).join('')||'<div class="mu">Операций пока нет</div>'}
<button class="btn r" onclick="A.reset()">Сбросить прогресс</button>`},
bm(){if(!S.inv.length)return '<div class="card mu">Нужен телефон. Купите его в Market.</div>';
return `<div class="card mu" style="font-size:13px">Включите телефон в Inventory и запустите тест. Проверенный результат поднимает цену на 4%.</div>`+S.inv.map(p=>`<div class="card row">${art(p.m,p.on,p.c)}<div class="fx"><b>${PH[p.m][1]}</b><div class="mu" style="font-size:12px">${p.on?'Включён':'Выключен'} · ${p.best?'рекорд '+p.best.toLocaleString('ru-RU'):'не тестировался'}</div></div><button class="btn" ${p.on?'':'class="d"'} onclick="${p.on?`A.bench(${p.id})`:`A.pw(${p.id})`}">${p.on?'Тест':'Вкл.'}</button></div>`).join('')}
};
